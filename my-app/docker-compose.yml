services:
  app:
    image: blog-front
    ports:
      - 3000:80
    build:
      context: ./blog-frontend
      dockerfile: Dockerfile
    container_name: blog-front
  nginx:
    image: nginx:1.20.1
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app