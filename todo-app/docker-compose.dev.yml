services:
  app:
    image: front-dev-proxy
    build:
      context: ./todo-frontend
      dockerfile: dev.Dockerfile
    volumes:
      - .:/usr/src/app 
    ports:
      - 5173:5173
    container_name: front-dev-proxy
  nginx:
    image: nginx:1.20.1
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.dev.conf:ro
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app